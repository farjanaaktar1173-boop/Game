<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Game Panel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI','Hind Siliguri',Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at top,#1a1f3a 0%,#0c0f1d 60%,#05060c 100%);color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:flex-end;overflow:hidden;touch-action:none}
body::before{content:'';position:fixed;top:-100px;left:50%;transform:translateX(-50%);width:400px;height:400px;background:radial-gradient(circle,rgba(255,215,0,.15) 0%,transparent 70%);pointer-events:none;z-index:0}
.gift-popup{position:fixed;bottom:0;left:0;width:100%;height:75vh;background:linear-gradient(160deg,#141a3d 0%,#0a0e22 50%,#05060f 100%);border-top-left-radius:30px;border-top-right-radius:30px;box-shadow:0 -15px 50px rgba(0,0,0,.9),0 -2px 0 rgba(255,215,0,.15),inset 0 1px 0 rgba(255,255,255,.08);display:flex;flex-direction:column;overflow:hidden;animation:slideUp .55s cubic-bezier(.22,1,.36,1);z-index:10;will-change:height}
.gift-popup.snapping{transition:height .35s cubic-bezier(.22,1,.36,1)}
.gift-popup::before{content:'';position:absolute;top:0;left:10%;right:10%;height:2px;background:linear-gradient(90deg,transparent,#ffd700,#ffb700,#ffd700,transparent);border-radius:2px;filter:blur(.5px);box-shadow:0 0 15px rgba(255,215,0,.7);z-index:3}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.drag-area{cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;padding-bottom:4px}
.drag-area:active{cursor:grabbing}
.popup-handle{width:55px;height:4px;background:linear-gradient(90deg,rgba(255,215,0,.3),rgba(255,215,0,.8),rgba(255,215,0,.3));border-radius:10px;margin:12px auto 4px auto;box-shadow:0 0 8px rgba(255,215,0,.4);transition:width .3s,background .3s}
.gift-popup.dragging .popup-handle{width:75px;background:linear-gradient(90deg,rgba(255,215,0,.5),#ffd700,rgba(255,215,0,.5));box-shadow:0 0 15px rgba(255,215,0,.8)}
.popup-header{display:flex;justify-content:center;gap:40px;padding:8px 20px 12px;border-bottom:1px solid rgba(255,255,255,.06);position:relative}
.tab{font-size:16px;font-weight:700;color:#8a8da4;cursor:pointer;padding:6px 4px 8px;position:relative;letter-spacing:.4px;transition:all .3s}
.tab.active{color:#ffd700;text-shadow:0 0 12px rgba(255,215,0,.6)}
.tab.active::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2.5px;background:linear-gradient(90deg,transparent,#ffd700,transparent);border-radius:4px;box-shadow:0 0 12px rgba(255,215,0,.8)}
.popup-content{padding:22px 16px 30px;overflow-y:auto;flex-grow:1;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.popup-content::-webkit-scrollbar{width:5px}
.popup-content::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#ffd700,#b8860b);border-radius:10px}
.game-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.game-card{position:relative;background:#05060f;border-radius:22px;cursor:pointer;transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s ease;aspect-ratio:1/1;overflow:hidden}
.game-card::before{content:'';position:absolute;inset:0;border-radius:22px;padding:2px;background:linear-gradient(145deg,#ffd700,#b8860b,#ffd700,#8b6914);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:5}
.game-card:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 0 25px rgba(255,215,0,.45),0 12px 30px rgba(0,0,0,.6)}
.game-card:active{transform:translateY(-2px) scale(.98)}
.image-container{position:relative;width:100%;height:100%;border-radius:22px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#0a0e22}
.blur-bg{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);object-fit:cover;filter:blur(15px) brightness(.6) saturate(1.5);z-index:1}
.main-img{position:relative;width:100%;height:100%;object-fit:contain;z-index:2;padding:4px;transition:transform .6s cubic-bezier(.22,1,.36,1)}
.game-card:hover .main-img{transform:scale(1.05)}
.new-game-card{position:relative;background:linear-gradient(145deg,rgba(255,71,87,.12),rgba(138,43,226,.08));border-radius:22px;cursor:pointer;transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s ease;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;aspect-ratio:1/1}
.new-game-card::before{content:'';position:absolute;inset:0;border-radius:22px;padding:2px;background:linear-gradient(145deg,#ff4757,#b3252f,#ff4757,#8a2be2);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:5}
.new-game-card:active{transform:translateY(-2px) scale(.98)}
.new-game-icon-wrap{width:65px;height:65px;border-radius:50%;background:radial-gradient(circle,rgba(255,71,87,.25),rgba(138,43,226,.1) 70%,transparent);display:flex;align-items:center;justify-content:center;margin-bottom:12px;position:relative;animation:pulseGlow 2.5s ease-in-out infinite}
.new-game-icon-wrap::before{content:'';position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(from 0deg,transparent,#ff4757,transparent,#8a2be2,transparent);filter:blur(6px);opacity:.5;animation:rotate 4s linear infinite}
@keyframes rotate{to{transform:rotate(360deg)}}
@keyframes pulseGlow{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.new-game-icon{font-size:30px;position:relative;z-index:2;filter:drop-shadow(0 0 8px rgba(255,71,87,.8))}
.new-game-text{font-size:15px;font-weight:700;letter-spacing:.6px;background:linear-gradient(90deg,#ff6b78,#ff4757,#a94bff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;position:relative;z-index:2}
@media (max-width:380px){.game-grid{gap:10px}.popup-content{padding:18px 12px 25px}.new-game-icon-wrap{width:55px;height:55px}.new-game-icon{font-size:26px}}
</style>
</head>
<body>

<div class="gift-popup" id="giftPopup">
    <div class="drag-area" id="dragArea">
        <div class="popup-handle"></div>
        <div class="popup-header">
            <div class="tab active">Hot</div>
            <div class="tab">Entertainment</div>
        </div>
    </div>
    <div class="popup-content">
        <div class="game-grid">
            <div class="game-card" onclick="openGame('space-wheel')">
                <div class="image-container">
                    <img src="https://raw.githubusercontent.com/farjanaaktar1173-boop/Gift/main/IMG_%E0%A7%A8%E0%A7%A6%E0%A7%A8%E0%A7%AC%E0%A7%A7%E0%A7%A6%E0%A7%A6%E0%A7%AD_%E0%A7%A6%E0%A7%AE%E0%A7%A8%E0%A7%A6%E0%A7%A7%E0%A7%AF.jpg" class="blur-bg" aria-hidden="true">
                    <img src="https://raw.githubusercontent.com/farjanaaktar1173-boop/Gift/main/IMG_%E0%A7%A8%E0%A7%A6%E0%A7%A8%E0%A7%AC%E0%A7%A7%E0%A7%A6%E0%A7%A6%E0%A7%AD_%E0%A7%A6%E0%A7%AE%E0%A7%A8%E0%A7%A6%E0%A7%A7%E0%A7%AF.jpg" class="main-img" alt="Space Wheel" loading="lazy">
                </div>
            </div>
            <div class="new-game-card" onclick="newGameComing()">
                <div class="new-game-icon-wrap">
                    <div class="new-game-icon">🎮</div>
                </div>
                <span class="new-game-text">নিউ গেম</span>
            </div>
        </div>
    </div>
</div>

<script>
/* ============ URL PARAMS (voice club থেকে আসে) ============ */
const params = new URLSearchParams(location.search);
const USER_UID   = params.get('uid')   || '';
const USER_NAME  = params.get('name')  || '';
const USER_PHOTO = params.get('photo') || '';

/* ============ OPEN GAME ============ */
function openGame(gameId){
    if(gameId === 'space-wheel'){
        // Popup নিচে নামানোর animation
        const popup = document.getElementById('giftPopup');
        popup.style.transition = 'transform .35s cubic-bezier(.22,1,.36,1)';
        popup.style.transform = 'translateY(100%)';

        setTimeout(() => {
            // URL params সহ space-wheel.html এ যাই
            const url = new URL('space-wheel.html', location.href);
            if(USER_UID)   url.searchParams.set('uid', USER_UID);
            if(USER_NAME)  url.searchParams.set('name', USER_NAME);
            if(USER_PHOTO) url.searchParams.set('photo', USER_PHOTO);
            location.href = url.toString();
        }, 320);
    }
}

/* ============ NEW GAME (placeholder) ============ */
function newGameComing(){
    const t = document.createElement('div');
    t.style.cssText = 'position:fixed;top:70px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#7c3aed,#4c1d95);border:1px solid #a855f7;padding:10px 22px;border-radius:30px;font-size:13px;font-weight:700;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 20px rgba(168,85,247,.6);z-index:9999;white-space:nowrap';
    t.textContent = '🎮 শীঘ্রই আসছে!';
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 1800);
}

/* ============ DRAG HANDLE (75% ↔ 100%) ============ */
(function(){
    const popup = document.getElementById('giftPopup');
    const dragArea = document.getElementById('dragArea');
    const MIN_HEIGHT_VH = 75;
    const MAX_HEIGHT_VH = 100;
    let isDragging = false;
    let startY = 0;
    let startHeight = 0;

    function getY(e){
        if(e.touches && e.touches.length) return e.touches[0].clientY;
        if(e.changedTouches && e.changedTouches.length) return e.changedTouches[0].clientY;
        return e.clientY;
    }
    function getCurrentHeight(){ return popup.getBoundingClientRect().height; }
    function getViewportHeight(){ return window.innerHeight; }

    function onDragStart(e){
        isDragging = true;
        popup.classList.add('dragging');
        popup.classList.remove('snapping');
        startY = getY(e);
        startHeight = getCurrentHeight();
        popup.style.transition = 'none';
        document.addEventListener('mousemove', onDragMove, { passive: false });
        document.addEventListener('mouseup', onDragEnd);
        document.addEventListener('touchmove', onDragMove, { passive: false });
        document.addEventListener('touchend', onDragEnd);
        document.addEventListener('touchcancel', onDragEnd);
    }
    function onDragMove(e){
        if(!isDragging) return;
        if(e.cancelable) e.preventDefault();
        const currentY = getY(e);
        const deltaY = startY - currentY;
        const vh = getViewportHeight();
        const minPx = (MIN_HEIGHT_VH / 100) * vh;
        const maxPx = (MAX_HEIGHT_VH / 100) * vh;
        let newHeight = startHeight + deltaY;
        if(newHeight < minPx) newHeight = minPx;
        if(newHeight > maxPx) newHeight = maxPx;
        popup.style.height = newHeight + 'px';
    }
    function onDragEnd(){
        if(!isDragging) return;
        isDragging = false;
        popup.classList.remove('dragging');
        document.removeEventListener('mousemove', onDragMove);
        document.removeEventListener('mouseup', onDragEnd);
        document.removeEventListener('touchmove', onDragMove);
        document.removeEventListener('touchend', onDragEnd);
        document.removeEventListener('touchcancel', onDragEnd);

        const currentH = getCurrentHeight();
        const vh = getViewportHeight();
        const currentVh = (currentH / vh) * 100;
        const midPoint = (MIN_HEIGHT_VH + MAX_HEIGHT_VH) / 2;

        popup.classList.add('snapping');
        popup.style.height = '';
        if(currentVh >= midPoint){
            popup.style.height = MAX_HEIGHT_VH + 'vh';
            popup.dataset.state = 'full';
        } else {
            popup.style.height = MIN_HEIGHT_VH + 'vh';
            popup.dataset.state = 'half';
        }
    }

    dragArea.addEventListener('mousedown', onDragStart);
    dragArea.addEventListener('touchstart', onDragStart, { passive: true });

    window.addEventListener('resize', () => {
        if(popup.dataset.state === 'full') popup.style.height = MAX_HEIGHT_VH + 'vh';
        else popup.style.height = MIN_HEIGHT_VH + 'vh';
    });
})();
</script>
</body>
</html>
